<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สัญญาไทย 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fb1;--pink-l:#ffe3ec;--lav:#b7a4f0;--lav-l:#eee9ff;--mint:#7fdcb5;--mint-l:#dcf7ea;--sun:#ffe08a;--ink:#5a4a6b;--bad:#ff6b81}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Mali','Noto Sans Thai','Tahoma',sans-serif;color:var(--ink);
background:radial-gradient(circle at 12% 8%,#ffd9e6 0,transparent 32%),radial-gradient(circle at 90% 90%,#dcd3ff 0,transparent 35%),#fff6fa;padding:16px}
.app{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}
.chip{background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:.9rem;box-shadow:0 3px 0 var(--pink-l)}
.bar{height:14px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 3px var(--pink-l);margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:99px;transition:width .5s}
.card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--lav-l),0 14px 30px rgba(183,164,240,.25)}
.ask{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.mascot{font-size:2.6rem;line-height:1;transition:transform .3s}
.mascot.hop{animation:hop .6s}
.bubble{background:var(--lav-l);border-radius:20px 20px 20px 4px;padding:12px 16px;line-height:1.6;font-size:1.02rem;flex:1}
.bubble small{display:block;font-weight:700;color:var(--lav);margin-bottom:2px}
.answer{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-radius:20px;background:var(--pink-l);min-height:70px;margin-bottom:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;border-radius:20px;border:3px dashed var(--lav);margin-bottom:14px}
.t{--s:46px;width:var(--s);height:var(--s);border-radius:14px;border:0;font:700 calc(var(--s)*.55) 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);cursor:pointer;padding:0}
.big .t{--s:38px}
.t.w{width:auto;min-width:var(--s);padding:0 12px;font-size:1rem}
.pool .t{background:var(--sun);box-shadow:0 4px 0 #f0c65a;transition:transform .1s}
.pool .t:hover{transform:translateY(-2px)}
.pool .t:active{transform:translateY(3px);box-shadow:0 1px 0 #f0c65a}
.pool .t.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--lav-l);color:transparent;cursor:default;transform:none}
.slot{background:#fff;box-shadow:inset 0 0 0 2px #ffc2d5;color:transparent}
.slot.on{color:var(--ink);box-shadow:0 4px 0 var(--pink)}
.slot.bad{background:#ffe0e5;box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.slot.ok{background:var(--mint-l);box-shadow:0 4px 0 var(--mint)}
.msg{min-height:1.6em;text-align:center;font-weight:700;margin-bottom:10px}
.full{background:var(--mint-l);border-radius:16px;padding:10px 14px;margin-bottom:14px;font:500 1.05rem/1.7 'Noto Sans SC','PingFang SC',sans-serif;text-align:center}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.b{font:700 1rem 'Mali',sans-serif;border:0;border-radius:99px;padding:12px 26px;cursor:pointer;color:#fff;background:var(--pink);box-shadow:0 5px 0 #e0678c}
button.b:active{transform:translateY(3px);box-shadow:0 2px 0 #e0678c}
button.b.g{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--lav-l),inset 0 0 0 2px var(--lav-l)}
button.b.n{background:var(--mint);box-shadow:0 5px 0 #4fbf92}
button.b:disabled{opacity:.45;cursor:not-allowed}
.end{text-align:center;padding:14px 0}
.end .em{font-size:4rem}
.end h2{margin:6px 0}
.hide{display:none!important}
.fx{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;animation:fall 2s ease-in forwards;z-index:9}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes hop{40%{transform:translateY(-14px) rotate(-8deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.6}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header><h1>🌸 เรียงตัวอักษรจีนให้ถูกนะ</h1><div class="chip" id="cnt">ข้อ 1 / 1</div></header>

  <div class="answer" id="ans" aria-label="พื้นที่วางคำตอบ"></div>
  <div class="pool" id="pool" aria-label="ตัวอักษรให้เลือก"></div>
  <div class="msg" id="msg"></div>
  <div class="full hide" id="full"></div>
  <div class="btns">
    <button class="b g" id="clr">🧹 ล้างใหม่</button>
    <button class="b" id="chk" disabled>ตรวจคำตอบ ✓</button>
    <button class="b n hide" id="nxt">ข้อถัดไป ➜</button>
  </div>
</div>
<div class="card end hide" id="end">
  <div class="em" id="eem">🏆</div><h2>ทำครบทุกข้อแล้ว!</h2>
  <p id="esum"></p>
  <button class="b" id="again">🔁 เล่นอีกครั้ง</button>
</div>
</div>

}
$('again').onclick=()=>{qi=0;wrongAll=0;$('end').classList.add('hide');$('quiz').classList.remove('hide');load()};
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const e=['🌸','⭐','💖','✨','🎀'];
  for(let i=0;i<22;i++){const s=document.createElement('span');s.className='fx';s.textContent=e[i%5];
    s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2800)}
}
load();
</script>
